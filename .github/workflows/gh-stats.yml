name: Update GitHub stats snapshot

on:
  schedule:
    - cron: '17 3 * * *' # daily, off the hour
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch stats and write snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/update-gh-stats.mjs

      - name: Commit snapshot if changed
        run: |
          if git diff --quiet -- gh-stats.json; then
            echo "No changes to gh-stats.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gh-stats.json
          git commit -m "chore: refresh GitHub stats snapshot"
          git push
